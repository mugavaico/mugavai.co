name: Next.js CI/CD

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main
      - develop

jobs:
  build:
    name: Build Next.js App
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          NODE_ENV: production

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: build

    # Deploy ONLY when main is updated
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Deployment
        run: |
          echo "Build successful"
          echo "Ready for production deployment"
